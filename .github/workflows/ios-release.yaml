name: "Firebase Release"

on:
  push:
    branches:
      - 'feature/setup-ci'
      - 'main'

jobs:
  release-ipa:
    runs-on: [self-hosted, macos, x64]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      
      - name: Set up ruby
        if: ${{ runner.name == 'Hosted Agent' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
      
      - name: Setup fastlane
        run: |
          gem install bundler:2.4.2
          bundle install --jobs 4 --retry 3 

      - name: Fastlane ios release
        env:
          FL_UNLOCK_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS_PATH }}
        run: |
          bundle exec fastlane ios release
